name: PR Quality & Automated Tests

on:
  pull_request:
    branches:
      - master
      - feat/aws-architecture

jobs:
  test-server:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-github-actions-secret-key-1234567890

  test-client:
    name: Frontend Unit Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test -- --run

      - name: Test Vite Production Build
        run: npm run build
